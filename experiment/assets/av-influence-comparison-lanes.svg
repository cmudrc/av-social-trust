<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="190mm" height="172.97mm" viewBox="0 0 1450 1320" role="img" aria-labelledby="title description">
<title id="title">Baseline, decision-level influence, and cognition-level influence in automated driving</title>
<desc id="description">Three panels show a data-informed driver baseline and simulated social extensions with separate driver and passenger rows. Context is green, cognition purple, decision blue, and driver action orange in every panel. Dashed arrows between rows identify social influence before or after decision formation. Two passengers illustrate a fully connected group structure.</desc>
<defs>
 <marker id="flow-arrow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#34454e"/></marker>
 <marker id="decision-peer-arrow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#246d94"/></marker>
 <marker id="cognition-peer-arrow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#8a50a0"/></marker>
 <style>
 text {font-family:Arial,Helvetica,sans-serif;fill:#1d2e38;}
 .title {font-size:29px;font-weight:700;}
 .panel-title {font-size:28px;font-weight:700;}
 .node {font-size:25px;fill:white;}
 .sub {font-size:21px;fill:white;}
 .role {font-size:21px;fill:#53616b;}
 .driver {font-size:21px;font-weight:700;fill:#1d2e38;}
 .note {font-size:22px;fill:#53616b;}
 .evidence {font-size:22px;font-weight:700;}
 .flow {fill:none;stroke:#34454e;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#flow-arrow);}
 .peer-decision {fill:none;stroke:#246d94;stroke-width:2.1;stroke-dasharray:6 4;marker-end:url(#decision-peer-arrow);}
 .peer-cognition {fill:none;stroke:#8a50a0;stroke-width:2.1;stroke-dasharray:6 4;marker-end:url(#cognition-peer-arrow);}
 </style>
</defs>
