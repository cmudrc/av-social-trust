[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "av-social-trust"
version = "0.1.1"
description = "Simulating passenger influence on a driver's trust in automation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3,<4",
    "numpy>=2,<3",
]

[project.optional-dependencies]
experiment = [
    "scipy>=1.15,<2",
    "matplotlib>=3.8,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["av_social_trust", "av_social_trust.*"]
namespaces = false
